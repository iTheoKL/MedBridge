<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MedBridge · Reminders</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body>
  <div class="app">
    <!-- Side Menu -->
    <aside class="sidebar">
      <div class="sidebar__brand">
        <span class="sidebar__logo">🩺</span>
        <span class="sidebar__title">MedBridge</span>
      </div>

      <nav class="sidebar__nav">
        <a href="ocr.html" class="nav-item" data-page="ocr">
          <span class="nav-item__icon">📷</span>
          <span class="nav-item__label">OCR Scan</span>
        </a>
        <a href="medications.html" class="nav-item" data-page="medications">
          <span class="nav-item__icon">💊</span>
          <span class="nav-item__label">List of Medications</span>
        </a>
        <a href="reminders.html" class="nav-item" data-page="reminders">
          <span class="nav-item__icon">⏰</span>
          <span class="nav-item__label">Reminders</span>
        </a>
        <a href="report.html" class="nav-item" data-page="report">
          <span class="nav-item__icon">📄</span>
          <span class="nav-item__label">Download Report</span>
        </a>
        <a href="symptoms.html" class="nav-item" data-page="symptoms">
          <span class="nav-item__icon">🩹</span>
          <span class="nav-item__label">Symptoms</span>
        </a>
      </nav>

      <div class="sidebar__footer">
        <p>&copy; 2026 MedBridge</p>
      </div>
    </aside>

    <!-- Main Content -->
    <div class="main">
      <!-- Top Bar -->
      <header class="topbar">
        <div class="topbar__left">
          <h1 class="topbar__title">Reminders</h1>
        </div>

        <div class="topbar__right">
          <div class="user-menu" id="userMenu">
            <button class="user-menu__trigger" id="userMenuTrigger" aria-haspopup="true" aria-expanded="false">
              <span class="user-menu__avatar">JD</span>
              <span class="user-menu__name">Jane Doe</span>
              <span class="user-menu__caret">▾</span>
            </button>

            <div class="user-menu__dropdown" id="userMenuDropdown">
              <a href="account.html" class="user-menu__item">
                <span class="user-menu__item-icon">⚙️</span> Manage Account
              </a>
              <a href="logout.html" class="user-menu__item user-menu__item--danger">
                <span class="user-menu__item-icon">🚪</span> Log Out
              </a>
            </div>
          </div>
        </div>
      </header>

      <!-- Page Content -->
      <main class="content">
        <div class="card card--stats" style="margin-bottom: 20px;">
          <div class="card__header">
            <h2 class="card__title">This Week</h2>
          </div>
          <div class="stats">
            <div class="stat">
              <p class="stat__value">86%</p>
              <p class="stat__label">Adherence Rate</p>
            </div>
            <div class="stat">
              <p class="stat__value" id="takenTodayStat">0</p>
              <p class="stat__label">Taken Today</p>
            </div>
            <div class="stat">
              <p class="stat__value stat__value--danger">1</p>
              <p class="stat__label">Missed This Week</p>
            </div>
          </div>
        </div>

        <div class="page-actions">
          <div class="segmented" id="tabs">
            <button class="segmented__option active" data-tab="today">Today</button>
            <button class="segmented__option" data-tab="upcoming">Upcoming</button>
            <button class="segmented__option" data-tab="history">History</button>
          </div>
          <button class="btn btn--primary" id="addReminderBtn">+ Add Reminder</button>
        </div>

        <section class="card">
          <div class="card__header">
            <h2 class="card__title" id="listTitle">Today</h2>
          </div>
          <ul class="reminder-list" id="reminderList"></ul>
          <div class="placeholder-state" id="emptyState" hidden>
            <span class="placeholder-state__icon">⏰</span>
            <p>Nothing here yet.</p>
          </div>
        </section>
      </main>
    </div>
  </div>

  <!-- Add Reminder Modal -->
  <div class="modal-overlay" id="reminderModalOverlay">
    <div class="modal">
      <div class="modal__header">
        <h3 class="modal__title">Add Reminder</h3>
        <button class="modal__close" id="modalClose" aria-label="Close">&times;</button>
      </div>

      <form class="modal__body" id="reminderForm">
        <div class="form-group">
          <label class="form-label" for="reminderMed">Medication</label>
          <select class="form-select" id="reminderMed">
            <option>Metformin — 500mg</option>
            <option>Ibuprofen — 200mg</option>
            <option>Warfarin — 5mg</option>
          </select>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="reminderTime">Time</label>
            <input type="time" class="form-input" id="reminderTime" value="08:00" required />
          </div>
          <div class="form-group">
            <label class="form-label" for="reminderDay">Day</label>
            <select class="form-select" id="reminderDay">
              <option value="Today">Today</option>
              <option value="Tomorrow">Tomorrow</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="reminderNotes">Notes</label>
          <input type="text" class="form-input" id="reminderNotes" placeholder="e.g. Take with food" />
        </div>

        <div class="form-actions">
          <button type="button" class="btn btn--secondary" id="modalCancel">Cancel</button>
          <button type="submit" class="btn btn--primary">Add Reminder</button>
        </div>
      </form>
    </div>
  </div>

  <div class="toast" id="toast">
    <span class="toast__icon">✅</span>
    <span id="toastMessage">Saved</span>
  </div>

  <script src="js/script.js"></script>
  <script src="js/reminders.js"></script>
</body>
</html>
